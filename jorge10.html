    <header>
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Harry_Potter_wordmark.svg" alt="logo Harry Potter" class="logo-hp">
        <form id="form">
            <input type="text" id="search" class="search" placeholder="Buscar personaje">
        </form>
    </header>
    <main id="main"></main>

    <script>
        const API_URL = 'https://hp-api.onrender.com/api/characters';
        const main = document.getElementById('main');
        const form = document.getElementById('form');
        const search = document.getElementById('search');

        // Get initial characters
        getCharacters(API_URL);

        async function getCharacters(url) {
            const res = await fetch(url);
            const data = await res.json();
            showCharacters(data);
        }

        function showCharacters(characters) {
            main.innerHTML = '';

            characters.forEach(character => {
                const { name, image, house, dateOfBirth, ancestry, patronus, actor } = character;

                const characterEl = document.createElement('div');
                characterEl.classList.add('character');

                characterEl.innerHTML = `
                    <img src="${image || 'https://via.placeholder.com/300x350.png?text=No+Image'}" alt="${name}">
                    <div class="character-info">
                        <h3>${name}</h3>
                        ${house ? `<span class="house-badge ${house}">${house}</span>` : ''}
                        <div class="info-item">
                            ${dateOfBirth ? `<p>Fecha de nacimiento: ${dateOfBirth}</p>` : ''}
                        </div>
                        <div class="info-item">
                            ${ancestry ? `<p>Ascendencia: ${ancestry}</p>` : ''}
                        </div>
                        <div class="info-item">
                            ${patronus ? `<p>Patronus: ${patronus}</p>` : ''}
                        </div>
                        <div class="info-item">
                            ${actor ? `<p>Actor: ${actor}</p>` : ''}
                        </div>
                    </div>
                `;

                main.appendChild(characterEl);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
        });

        search.addEventListener('keyup', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const characters = document.querySelectorAll('.character');

            characters.forEach(character => {
                const title = character.querySelector('h3').innerText.toLowerCase();
                const info = character.querySelector('.character-info').innerText.toLowerCase();

                if (title.includes(searchTerm) || info.includes(searchTerm)) {
                    character.style.display = 'block';
                } else {
                    character.style.display = 'none';
                }
            });
        });
    </script>
