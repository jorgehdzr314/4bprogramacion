            font-size: 18px;

            outline: none;

            width: 320px;
            margin-top: 8px;
        }
        .search::placeholder {
            color: #b3c6e0;
            opacity: 1;
        }
        .search:focus {
            background: rgba(255,255,255,0.25);
            border: 2px solid #fff;

        main {
            display: flex;
            flex-wrap: wrap;

            padding: 30px 0 40px 0;

        }
        .personaje {
            width: 320px;

            margin: 0;
            background: rgba(255,255,255,0.10);
            box-shadow: 0 8px 32px 0 rgba(31,38,135,0.37);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 24px;
            border: 1.5px solid rgba(255,255,255,0.18);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }
        .personaje:hover {
            transform: scale(1.04) translateY(-8px);
            box-shadow: 0 16px 40px 0 rgba(31,38,135,0.45);
            border-color: var(--color-acento);
        }
        .personaje img {
            width: 100%;
            height: 340px;
            object-fit: cover;
            background: rgba(0,0,0,0.08);
            border-bottom: 2px solid var(--color-acento);
        }
        .personaje-info {
            color: var(--color-blanco);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            padding: 12px 18px 8px 18px;
            width: 100%;
            letter-spacing: 1px;
        }
        .personaje-info h1 {
            color: var(--color-acento);
            font-size: 1.3em;
            margin: 0;
            font-weight: bold;
        }
        .personaje-info span {
            background: var(--color-cuarto);
            color: #fff;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9em;
        }
        .overview {
            background: rgba(36, 50, 95, 0.92);
            color: #fff;
            padding: 28px 20px 20px 20px;
            position: absolute;
            left: 0;
            bottom: 0;
            right: 0;
            max-height: 100%;
            transform: translateY(101%);
            overflow-y: auto;
            transition: transform 0.6s cubic-bezier(.4,2,.6,1);
            font-size: 1em;
        }
        .personaje:hover .overview {
            transform: translateY(0);
        }
        .overview h3 {
            margin-top: 0;
            color: var(--color-acento);
            font-size: 1.1em;
        }
        .status-icon {
            height: 0.8em;
            width: 0.8em;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .status-Alive { background-color: #55cc44; }
        .status-Dead { background-color: #d63d2e; }
        .status-unknown { background-color: #9e9e9e; }
        @media (max-width: 700px) {

                min-width: 0;
            }

            }

                height: 60px;
                margin-right: 10px;
            }
            header {

                gap: 8px;

    <header>
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Rick_and_Morty.svg" alt="logo Rick and Morty" class="logo-rm">
        <form id="form">
            <input type="text" id="search" class="search" placeholder="Busca tu personaje">
        </form>
    </header>
    <main id="main"></main>

    <script>
        const API_URL = 'https://rickandmortyapi.com/api/character';
        const main = document.getElementById('main');
        const form = document.getElementById('form');
        const search = document.getElementById('search');

        getCharacters(API_URL);

        async function getCharacters(url) {
            const res = await fetch(url);
            const data = await res.json();
            showCharacters(data.results || data);
        }

        function showCharacters(characters) {
            main.innerHTML = '';
            characters.forEach((char) => {
                const { name, image, status, species, location, origin, episode } = char;
                const charElements = document.createElement('div');
                charElements.classList.add('personaje');
                charElements.innerHTML = `
                    <img src="${image}" alt="${name}">
                    <div class="personaje-info">
                        <h1>${name}</h1>
                        <span>${species}</span>
                    </div>
                    <div class="overview">
                        <h3>Información</h3>
                        <p><span class="status-icon status-${status}"></span><strong>Estado:</strong> ${status}</p>
                        <p><strong>Especie:</strong> ${species}</p>
                        <p><strong>Origen:</strong> ${origin.name}</p>
                        <p><strong>Ubicación:</strong> ${location.name}</p>
                        <p><strong>Apariciones:</strong> ${episode.length} episodios</p>
                    </div>
                `;
                main.appendChild(charElements);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const searchTerm = search.value.toLowerCase();
            if (searchTerm && searchTerm !== '') {
                getCharacters(`${API_URL}?name=${searchTerm}`);
                search.value = '';
            } else {
                window.location.reload();
            }
        });
    </script>
